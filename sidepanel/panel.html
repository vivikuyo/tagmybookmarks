<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TagMyBookmarks</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">Tag<span>MyBookmarks</span></div>
    <div class="bar-actions">
      <span id="count" class="pane-title bar-count">—</span>
      <button id="viewBtn" class="icon" title="视图设置：行密度 / 显示方式 / 折叠">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </button>
      <div id="viewMenu" class="view-menu" hidden>
        <div class="view-row"><span class="view-k">行密度</span><button id="densityBtn" class="mini-btn" title="标准 / 紧凑 / 极简（只存本机，不进 Sync）">标准</button></div>
        <div class="view-row"><span class="view-k">显示方式</span><button id="groupBtn" class="mini-btn" title="清单（平铺）/ 目录（按文件夹插组头，可折叠）">清单</button></div>
        <div class="view-row"><span class="view-k">文件夹</span><button id="foldBtn" class="mini-btn" title="折叠 / 展开所有文件夹（仅目录模式）" hidden>折叠全部</button></div>
      </div>
      <button id="btnSpace" class="icon" title="管理台（全页）"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
      <button id="btnRebuild" class="icon" title="重建索引"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    </div>
  </header>

  <div class="query">
    <input id="q" type="text" spellcheck="false" autocomplete="off"
           placeholder="前端, Chrome + 设计 - 旧    ?关键词" />
    <button id="btnClear" class="clear" title="清空">×</button>
    <div id="suggest" class="suggest" hidden></div>
  </div>
  <div id="syntax" class="syntax" hidden></div>

  <div id="cloudArea" class="cloud-area">
  <section class="pane tags-pane">
    <div class="pane-head">
      <span class="pane-title">相关标签</span>
      <label class="mini"><input type="checkbox" id="relatedOnly" /> 仅相关</label>
    </div>
    <div id="cloud" class="cloud"></div>
  </section>

  <section class="pane dir-pane" id="dirPane">
    <div class="pane-head">
      <span class="pane-title">目录 <span id="dirCount" class="pane-sub"></span></span>
      <label class="mini" title="关闭后 @目录 不再参与查询，目录一栏隐藏">
        <input type="checkbox" id="folderTags" /> 启用目录标签
      </label>
    </div>
    <div id="dirCloud" class="cloud dir-cloud"></div>
  </section>
  </div>

  <div id="cloudSplit" class="cloud-split" title="拖动：交换标签云与列表的空间（默认/双击回到列表 6 行）"></div>

  <section class="pane list-pane">
    <!-- 操作带：一行到底。视图设置收进顶栏的 ⋯，条数移到顶栏，这里只剩全选 + 标签动作 -->
    <div id="bulk" class="bulk">
      <input type="checkbox" id="bulkAll" title="全选 / 取消全选（当前列表）" />
      <span id="bulkCount" class="bulk-count" hidden>已选 0</span>
      <div id="bulkFloat" class="bulk-float">
        <span class="bulk-tagwrap">
          <input id="tagInput" type="text" placeholder='可连续输入标签，空格 or , 分开；带空格标签用 ""' autocomplete="off" />
          <button id="tagClear" class="clear" title="清空输入">×</button>
        </span>
        <button class="mini-btn" data-act="add">加</button>
        <button class="mini-btn" data-act="untag">摘</button>
        <button class="mini-btn" data-act="clear">清空</button>
        <button class="mini-btn" data-act="open">打开</button>
        <button class="mini-btn danger" data-act="delete">删除</button>
        <button class="bulk-float-x" data-act="unselect" title="取消选择">×</button>
      </div>
    </div>
    <ul id="list" class="list"></ul>
  </section>

  <div id="trashAsk" class="trash-ask" hidden>
    <div class="trash-ask-card">
      <p class="trash-ask-t">第一次删除：还没有回收站</p>
      <p class="trash-ask-d">创建到「其他书签/TagSpace/回收站」？删除的书签移进去，可随时还原。书签树里有现成的回收站目录、或想自选位置，请到管理页「回收站」里设置。</p>
      <div class="trash-ask-btns">
        <button id="trashYes" class="mini-btn">使用默认位置</button>
        <button id="trashNo" class="mini-btn">取消</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module" src="panel.js"></script>
</body>
</html>
